services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: hacktaika_postgres
    environment:
      POSTGRES_DB: hacktaika
      POSTGRES_USER: hacktaika
      POSTGRES_PASSWORD: hacktaika123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/create_blog_table.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - hacktaika_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hacktaika -d hacktaika"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hacktaika_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://hacktaika:hacktaika123@postgres:5432/hacktaika
      - PYTHONPATH=/app
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hacktaika_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy with Frontend
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: hacktaika_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/build:/var/www/html:ro
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - hacktaika_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  hacktaika_network:
    driver: bridge