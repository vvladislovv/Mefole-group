<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка сервера</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0b0b;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .error-container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            color: #A6F00C;
        }
        h2 {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: #B0B0B0;
        }
        p {
            font-size: 1rem;
            margin: 1rem 0;
            color: #888;
        }
        a {
            color: #A6F00C;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>500</h1>
        <h2>Внутренняя ошибка сервера</h2>
        <p>Извините, произошла ошибка на сервере. Мы работаем над её устранением.</p>
        <p><a href="/">Вернуться на главную</a></p>
    </div>
</body>
</html>
